# Bot prerender + live sitemap for Check A Review (public site)
# Include the map{} block in http {}, and the location blocks in your
# HTTPS server {} for checkareview.com

map $http_user_agent $is_search_bot {
  default 0;
  ~*(googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebookexternalhit|twitterbot|linkedinbot|applebot|semrushbot|ahrefsbot|gptbot|claudebot|bytespider|perplexity) 1;
}

# Live sitemap (auto-updates when businesses are published)
location = /sitemap.xml {
  proxy_pass https://api.checkareview.com/api/sitemap.xml;
  proxy_http_version 1.1;
  proxy_set_header Host api.checkareview.com;
  proxy_ssl_server_name on;
}

# IndexNow ownership key (Bing/Yandex auto-notify)
location = /car-indexnow-8f2c4a91e6b03d75.txt {
  proxy_pass https://api.checkareview.com/api/car-indexnow-8f2c4a91e6b03d75.txt;
  proxy_http_version 1.1;
  proxy_set_header Host api.checkareview.com;
  proxy_ssl_server_name on;
  default_type text/plain;
}

# Search bots get prerendered business HTML; browsers keep the SPA
location ~ ^/businesses/(?<biz_slug>[^/]+)/?$ {
  error_page 418 = @bot_business_prerender;
  if ($is_search_bot = 1) {
    return 418;
  }
  try_files $uri /index.html;
}

location @bot_business_prerender {
  proxy_pass https://api.checkareview.com/api/prerender/businesses/$biz_slug;
  proxy_http_version 1.1;
  proxy_set_header Host api.checkareview.com;
  proxy_ssl_server_name on;
}
